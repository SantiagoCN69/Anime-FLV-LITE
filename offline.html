        -webkit-text-fill-color: transparent;
        background-clip: text;
        position: relative;
        z-index: 1;
      }
      p {

        opacity: 0.8;
        line-height: 1.6;
        margin-bottom: 2rem;
        font-size: 0.95rem;
        position: relative;
        z-index: 1;
      }
      a {
        display: inline-block;
        padding: 0.875rem 2rem;
        background: linear-gradient(135deg, var(--btn), var(--btn2));
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        position: relative;
        z-index: 1;
      }
      a {

        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(169, 112, 255, 0.4);
      }
      a:active {
        transform: translateY(0);
      }
