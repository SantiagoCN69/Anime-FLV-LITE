    <script>
      const animeId = new URLSearchParams(location.search).get("id");
      document.getElementById('titulo-anime').style.setProperty('view-transition-name', "title" + animeId);
    </script>
    <div class="contenedor-btn-cap">
      <h3 id="btn-cap" class="btn-cap">Episodio</h3>
    <script>
      document.getElementById('btn-cap').style.setProperty('view-transition-name', "episodio" + animeId);
    </script>
      <button type="button" id="btn-estado-capitulo" title="Marcar capítulo como visto">
        <span id="texto-estado-capitulo" class="texto-estado-capitulo">No visto</span>
      </button>
    </div>

    <div class="reproductor-container">
      <div id="controles">
        <div id="reproductor-container-carga"></div>
      </div>
      <span id="fullscreen" title="Pantalla completa"><img src="icons/play-solid.svg" alt="play"></span>
      <div id="video"></div>
     <script>
      const url = new URLSearchParams(location.search);
      const id = url.get("id");
      const episodeId = url.get("url");
      document.getElementById('video').style.setProperty('view-transition-name', id + "-" + episodeId);
     </script>
    </div>

   <div class="botones-reproductor">
    <div>
     <a href="#" id="btn-anterior-capitulo" class="btn-anterior desactivado" aria-label="Capítulo anterior">
       <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
         <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
       </svg>
       <span id="texto-anterior">EP -</span>
     </a>
     <button disabled type="button" id="btn-selector-capitulo" class="btn-selector-capitulo desactivado" aria-label="Seleccionar capítulo">
       <span id="numero-capitulo-actual">Episodio 1</span>
       <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
         <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
       </svg>
     </button>
     <div id="dropdown-capitulos" class="dropdown-capitulos oculto">
       <!-- Los capítulos se generarán dinámicamente con JavaScript -->
     </div>
     <a href="#" id="btn-siguiente-capitulo" class="btn-siguiente desactivado" aria-label="Capítulo siguiente">
       <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
         <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="texto-siguiente">EP +</span>
     </a>
    </div>
    <div>
     <button disabled type="button" id="btn-cambio-servers">Server Doblados</button>
     <button type="button" id="btn-bloquear-anuncios" class="btn-anuncios activo">AdBlock: ON</button>
    </div>
  </div>
</section>
<section>
  <h3>Noticias Anime</h3>
  <div id="noticias_container" class="noticias-container">
    <span id="init-loading-noticias" class="span-carga">Cargando noticias...</span>
  </div>

</section>
</main>
<div id="main"></div>

</body>
</html>
