<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto y Sugerencias | AniZen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Envíanos tus sugerencias y reportes para mejorar AniZen. Tu opinión nos ayuda a crecer.">
    <link rel="icon" type="image/png" href="/icons/icon3.png">
    <script src="scripts/tema.js"></script>
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/style_contacto.css">
</head>
<body>


    <main class="contacto-main">
        <div class="contacto-decoration">
            <div class="floating-element floating-1"></div>
            <div class="floating-element floating-2"></div>
            <div class="floating-element floating-3"></div>
            <div class="floating-element floating-4"></div>
            <div class="floating-element floating-5"></div>
        </div>
        <div class="contacto-container">
            <div class="contacto-header">
                <h1 class="contacto-title">Contacto</h1>
                <p class="contacto-subtitle">Tu opinión ayuda a mejorar AniZen</p>
            </div>

            <form class="contacto-form" id="contactoForm" action="https://formspree.io/f/mkjwvlrl" method="POST">
                <div class="form-tabs">
                    <button type="button" class="tab-btn active" data-tab="sugerencia">
                        <svg width="20" height="20" viewBox="0 0 65 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M32.5 3.5C16.5 3.5 3.5 16.5 3.5 32.5C3.5 48.5 16.5 61.5 32.5 61.5C48.5 61.5 61.5 48.5 61.5 32.5C61.5 16.5 48.5 3.5 32.5 3.5ZM32.5 56.5C19.5 56.5 8.5 45.5 8.5 32.5C8.5 19.5 19.5 8.5 32.5 8.5C45.5 8.5 56.5 19.5 56.5 32.5C56.5 45.5 45.5 56.5 32.5 56.5Z" fill="currentColor"/>
                            <path d="M32.5 18.5C30.5 18.5 28.5 20.5 28.5 22.5V32.5C28.5 34.5 30.5 36.5 32.5 36.5H42.5C44.5 36.5 46.5 34.5 46.5 32.5C46.5 30.5 44.5 28.5 42.5 28.5H36.5V22.5C36.5 20.5 34.5 18.5 32.5 18.5Z" fill="currentColor"/>
                        </svg>
                        Sugerencia
                    </button>
                    <button type="button" class="tab-btn" data-tab="reporte">
                        <svg width="20" height="20" viewBox="0 0 65 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M32.5 3.5C16.5 3.5 3.5 16.5 3.5 32.5C3.5 48.5 16.5 61.5 32.5 61.5C48.5 61.5 61.5 48.5 61.5 32.5C61.5 16.5 48.5 3.5 32.5 3.5ZM28.5 46.5L18.5 36.5L21.5 33.5L28.5 40.5L43.5 25.5L46.5 28.5L28.5 46.5Z" fill="currentColor"/>
                        </svg>
                        Reporte
                    </button>
                    <button type="button" class="tab-btn" data-tab="otro">
                        <svg width="20" height="20" viewBox="0 0 65 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M32.5 3.5C16.5 3.5 3.5 16.5 3.5 32.5C3.5 48.5 16.5 61.5 32.5 61.5C48.5 61.5 61.5 48.5 61.5 32.5C61.5 16.5 48.5 3.5 32.5 3.5ZM36.5 46.5H28.5V38.5H36.5V46.5ZM36.5 33.5H28.5V18.5H36.5V33.5Z" fill="currentColor"/>
                        </svg>
                        Otro
                    </button>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de mensaje</label>
                    <select id="tipo" name="tipo" required data-fs-field>
                        <option value="">Selecciona una opción</option>
                        <option value="sugerencia">Sugerencia de mejora</option>
                        <option value="reporte-enlace">Enlace roto</option>
                        <option value="reporte-video">Video no funciona</option>
                        <option value="reporte-info">Información incorrecta</option>
                        <option value="anime-faltante">Anime faltante</option>
                        <option value="bug">Error técnico</option>
                        <option value="otro">Otro</option>
                    </select>
                    <span data-fs-error="tipo"></span>
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Escribe un asunto breve..." required data-fs-field>
                    <span data-fs-error="asunto"></span>
                </div>

                <div class="form-group">
                    <label for="anime-relacionado">Anime relacionado (opcional)</label>
                    <input type="text" id="anime-relacionado" name="anime-relacionado" placeholder="Nombre del anime si aplica..." data-fs-field>
                    <span data-fs-error="anime-relacionado"></span>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="6" placeholder="Describe tu sugerencia o reporte con detalle..." required data-fs-field></textarea>
                    <div class="char-counter"><span id="charCount">0</span>/500</div>
                    <span data-fs-error="mensaje"></span>
                </div>

                <div class="form-group">
                    <label for="email">Tu email (opcional)</label>
                    <input type="email" id="email" name="email" placeholder="email@ejemplo.com" data-fs-field>
                    <small>Si quieres recibir respuesta sobre tu mensaje</small>
                    <span data-fs-error="email"></span>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="anonimo" name="anonimo" data-fs-field>
                        <span>Enviar de forma anónima</span>
                    </label>
                    <span data-fs-error="anonimo"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit" data-fs-submit-btn>
                        <svg width="20" height="20" viewBox="0 0 65 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3.5 32.5L61.5 32.5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                            <path d="M41.5 12.5L61.5 32.5L41.5 52.5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                        </svg>
                        Enviar mensaje
                    </button>
                    <button type="reset" class="btn-reset">
                        <svg width="20" height="20" viewBox="0 0 65 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M32.5 8.5C19.5 8.5 8.5 19.5 8.5 32.5C8.5 45.5 19.5 56.5 32.5 56.5C45.5 56.5 56.5 45.5 56.5 32.5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                            <path d="M32.5 18.5L32.5 32.5L46.5 32.5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                        </svg>
                        Limpiar formulario
                    </button>
                </div>

                <div data-fs-error class="form-error"></div>
                <div data-fs-success class="form-success"></div>
            </form>

            <div class="back-home">
                <a href="index.html" class="btn-back-home">
                    <svg width="20" height="20" viewBox="0 0 65 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24.3334 56.7777H10.8148C9.32165 56.7777 8.11115 55.5673 8.11115 54.074V33.5643C8.11115 32.8472 8.39601 32.1594 8.90303 31.6525L30.5327 10.0229C31.5885 8.96699 33.3005 8.96699 34.3563 10.0229L55.9859 31.6525C56.4928 32.1594 56.7778 32.8472 56.7778 33.5643V54.074C56.7778 55.5673 55.5674 56.7777 54.0741 56.7777H40.5556M24.3334 56.7777H40.5556M24.3334 56.7777V40.5555C24.3334 39.0622 25.5439 37.8518 27.0371 37.8518H37.8519C39.3451 37.8518 40.5556 39.0622 40.5556 40.5555V56.7777" stroke="currentColor" stroke-width="4.05556" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Volver al Inicio
                </a>
            </div>

        </div>
    </main>

    <script>
        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
        formspree('initForm', {
            formElement: '#contactoForm',
            formId: 'mkjwvlrl',
            onSuccess: function() {
                // Resetear el formulario después del envío exitoso
                document.getElementById('contactoForm').reset();
                document.getElementById('charCount').textContent = '0';
            }
        });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

    <script>
        // Lógica de tabs
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tipoSelect = document.getElementById('tipo');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const tab = btn.dataset.tab;
                if (tab === 'sugerencia') {
                    tipoSelect.value = 'sugerencia';
                } else if (tab === 'reporte') {
                    tipoSelect.value = 'reporte-enlace';
                } else {
                    tipoSelect.value = 'otro';
                }
            });
        });

        // Contador de caracteres
        const mensaje = document.getElementById('mensaje');
        const charCount = document.getElementById('charCount');
        const maxLength = 500;

        mensaje.addEventListener('input', () => {
            const currentLength = mensaje.value.length;
            charCount.textContent = currentLength;
            
            if (currentLength > maxLength) {
                mensaje.value = mensaje.value.substring(0, maxLength);
                charCount.textContent = maxLength;
            }
            
            if (currentLength >= maxLength * 0.9) {
                charCount.style.color = 'var(--btn2)';
            } else {
                charCount.style.color = 'currentColor';
            }
        });



        // Checkbox anónimo
        const anonimoCheckbox = document.getElementById('anonimo');
        const emailInput = document.getElementById('email');

        anonimoCheckbox.addEventListener('change', () => {
            if (anonimoCheckbox.checked) {
                emailInput.value = '';
                emailInput.disabled = true;
                emailInput.style.opacity = '0.5';
            } else {
                emailInput.disabled = false;
                emailInput.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
